workflow:
    # prettier-ignore
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # master after a merge
        - &release_tag_rule
          if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'  # release tags only

stages:
    - test
    - deploy # starts after all jobs of the test stage pass

.npm:
    stage: test
    image: node:22
    before_script:
        - npm ci

format:
    extends: .npm
    script:
        - npm run format:check

lint:
    extends: .npm
    script:
        - npm run lint

test:
    extends: .npm
    image: node:$NODE_VERSION # replaces node:22 of .npm
    parallel:
        matrix:
            - NODE_VERSION: ["22.13", "24", "26"] # the lowest version in engines, the latest 24.x and the latest 26.x
    script:
        - npm run test:report -- --coverage
    coverage: '/^All files\s*\|\s*([\d.]+)/'
    artifacts:
        when: always
        reports:
            junit: .vitest/junit.xml
            coverage_report:
                coverage_format: cobertura
                path: coverage/cobertura-coverage.xml

# prettier-ignore
deploy:
    stage: deploy
    image: node:22              # includes git and curl
    rules:
        - *release_tag_rule
    variables:
        GIT_DEPTH: 0            # full history; pushing a shallow clone to GitHub fails
    resource_group: production  # deploy jobs run one at a time, oldest pipeline first (set via API, see RELEASING.md)
    environment:
        name: production
        url: https://frank-kps0.onrender.com/
    script:
        # the tagged commit must be on master
        - git fetch origin master
        - git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD
        # the tag must match the version in package.json
        - test "${CI_COMMIT_TAG#v}" = "$(node -p "require('./package.json').version")"
        - git push --force "https://WardenSpirit:${GITHUB_PUSH_TOKEN}@github.com/WardenSpirit/Frank.git" "$CI_COMMIT_SHA:refs/heads/master"
        - curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${CI_COMMIT_SHA}"
